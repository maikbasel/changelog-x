[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
ignore = [
    # Unmaintained transitive deps with no upstream fix. Both reach us only through
    # git-cliff-core, which still requires bincode 2 and rust-embed. Revisit 2026-10-01.
    { id = "RUSTSEC-2025-0141", reason = "bincode via git-cliff-core - transitive" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via git-cliff-core/rust-embed - transitive" },
    # git2 unsoundness is fixed in 0.21, but git-cliff-core requires ^0.20.3, so git2
    # 0.20 stays in the lockfile regardless of what this crate depends on directly.
    # Neither Remote::list() nor blame_buffer() is called anywhere in this crate.
    # Revisit when git-cliff-core moves to git2 0.21.
    { id = "RUSTSEC-2026-0183", reason = "git2 Remote::list() unsoundness - unused API, pinned by git-cliff-core" },
    { id = "RUSTSEC-2026-0184", reason = "git2 BlameHunk signature unsoundness - unused API, pinned by git-cliff-core" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]